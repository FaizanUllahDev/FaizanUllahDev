name: Refresh GitHub profile activity
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-activity-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Generate authenticated metrics
        env:
          GH_METRICS_TOKEN: ${{ secrets.GH_METRICS_TOKEN }}
          PROFILE_LOGIN: FaizanUllahDev
        run: python3 scripts/profile_metrics.py
      - name: Commit changed chart only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- assets/github-metrics.svg; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/github-metrics.svg
          git commit -m 'chore(profile): refresh authenticated metrics'
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin "HEAD:${{ github.ref_name }}"
